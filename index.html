<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うさチル">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>うさチルplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 背景にぼかしたジャケット(動く壁紙)、その上にガラス風のカードとリスト。
   ジャケットをタップすると全画面のビジュアライザー。 */
*,*::before,*::after { box-sizing: border-box; }
:root {
  --h: 330; --s: 70%;                       /* ジャケットから取った色(JSで更新) */
  --accent: hsl(var(--h) calc(var(--s) * .85) 54%);
  --accent-fg: #fff;
  --accent-soft: hsl(var(--h) var(--s) 54% / .16);
  --fg: #221b29; --muted: #5f5669;
  --glass: rgb(255 255 255 / .58); --glass-strong: rgb(255 255 255 / .74);
  --line: rgb(40 20 50 / .10);
  --veil: linear-gradient(180deg, rgb(255 250 253 / .30), rgb(255 250 253 / .55));
  --base: hsl(var(--h) 60% 92%);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-round: "Zen Maru Gothic", var(--font-body);
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: hsl(var(--h) var(--s) 72%); --accent-fg: #1a0e1c; --accent-soft: hsl(var(--h) var(--s) 72% / .18);
    --fg: #f4eff7; --muted: #b5abbe;
    --glass: rgb(24 18 30 / .48); --glass-strong: rgb(24 18 30 / .66);
    --line: rgb(255 255 255 / .10);
    --veil: linear-gradient(180deg, rgb(12 8 16 / .30), rgb(12 8 16 / .62));
    --base: hsl(var(--h) 35% 12%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: hsl(var(--h) var(--s) 72%); --accent-fg: #1a0e1c; --accent-soft: hsl(var(--h) var(--s) 72% / .18);
  --fg: #f4eff7; --muted: #b5abbe;
  --glass: rgb(24 18 30 / .48); --glass-strong: rgb(24 18 30 / .66);
  --line: rgb(255 255 255 / .10);
  --veil: linear-gradient(180deg, rgb(12 8 16 / .30), rgb(12 8 16 / .62));
  --base: hsl(var(--h) 35% 12%);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--base); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  overflow: hidden; transition: background-color .8s;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; fill: currentColor; }
[hidden] { display: none !important; }

/* ---- 動く壁紙 ---- */
#bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; transform: scale(calc(1 + var(--pulse, 0) * .07)); will-change: transform; }
.bgl { position: absolute; inset: -18%; background-size: cover; background-position: center; filter: blur(42px) saturate(1.5); opacity: 0; transition: opacity 1.2s ease; animation: drift 46s ease-in-out infinite alternate; }
.bgl.on { opacity: 1; }
.bgl.blank {
  background:
    radial-gradient(40% 35% at 25% 25%, hsl(330 85% 80%), transparent 70%),
    radial-gradient(45% 40% at 80% 30%, hsl(265 80% 82%), transparent 70%),
    radial-gradient(50% 45% at 50% 85%, hsl(195 80% 82%), transparent 70%),
    hsl(300 60% 92%);
}
@keyframes drift {
  0%   { transform: translate(0, 0) scale(1.05) rotate(0deg); }
  50%  { transform: translate(-4%, 3%) scale(1.18) rotate(4deg); }
  100% { transform: translate(3%, -3%) scale(1.10) rotate(-3deg); }
}
#veil { position: fixed; inset: 0; z-index: -1; background: var(--veil); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .bgl { animation: none; } #bg { transform: none; } }

.glass { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }

.app { height: 100%; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand img { width: 30px; height: 30px; border-radius: 9px; }
.brand h1 { font-family: var(--font-round); font-size: 19px; font-weight: 700; letter-spacing: .02em; margin: 0; white-space: nowrap; }
.add {
  position: relative; overflow: hidden; flex: none;
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding-inline: 16px;
  background: var(--accent); color: var(--accent-fg); border-radius: 20px; font-weight: 700; font-size: 14px;
  transition: background-color .8s;
}
.add svg { width: 18px; height: 18px; }
.add input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

.card { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.now { display: flex; align-items: center; gap: 14px; min-width: 0; }
.art { position: relative; flex: none; width: 88px; height: 88px; border-radius: 18px; }
.art canvas { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); pointer-events: none; }
.art img { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 18px; box-shadow: 0 6px 20px rgb(0 0 0 / .22); }
.art .ph { position: relative; width: 100%; height: 100%; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.art .ph svg { width: 40px; height: 40px; }
.art .tapme { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); box-shadow: 0 2px 8px rgb(0 0 0 / .25); }
.art .tapme svg { width: 15px; height: 15px; }
.meta { min-width: 0; flex: 1; }
.label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; color: var(--muted); }
.title { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.artist { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.5em; }
.sub { font-size: 12px; color: var(--muted); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.seek { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek span { flex: none; width: 40px; }
.seek span:last-child { text-align: right; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; margin: 0; }

.ctrls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.ico svg { width: 24px; height: 24px; }
.ico.mode { color: var(--muted); }
.ico.mode.on { color: var(--accent); background: var(--accent-soft); }
.ico:active { opacity: .6; }
.play { width: 62px; height: 62px; background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 18px hsl(var(--h) var(--s) 40% / .35); transition: background-color .8s; }
.play svg { width: 30px; height: 30px; }

.views { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: inline-flex; padding: 3px; border-radius: 20px; }
.seg button { height: 32px; padding-inline: 16px; border-radius: 16px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.listhead { display: flex; align-items: center; gap: 8px; }
.listhead input[type=search] { flex: 1; min-width: 0; height: 38px; border-radius: 19px; color: var(--fg); padding-inline: 14px; font: inherit; font-size: 14px; }
.listhead input::placeholder { color: var(--muted); }
.chip { height: 38px; padding-inline: 12px; border-radius: 19px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.chip.warn { color: var(--accent); border-color: var(--accent); }

.pane { flex: 1; min-height: 0; overflow-y: auto; border-radius: 18px; padding-inline: 8px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .pick { flex: 1; min-width: 0; text-align: left; padding: 8px 4px; display: flex; align-items: center; gap: 12px; }
.th { flex: none; width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.th svg { width: 22px; height: 22px; }
.tx { min-width: 0; flex: 1; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ar { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.cur .nm { color: var(--accent); font-weight: 700; }
.row.cur .th { outline: 2px solid var(--accent); outline-offset: -2px; }
.mini { flex: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
.mini svg { width: 20px; height: 20px; }
.mini:active { background: var(--accent-soft); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px 12px; padding: 12px 2px 10px; }
.alb { text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.alb .cv { width: 100%; aspect-ratio: 1; border-radius: 14px; background: var(--accent-soft); color: var(--accent); object-fit: cover; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .14); }
.alb .cv svg { width: 36px; height: 36px; }
.alb.cur .cv { outline: 2px solid var(--accent); outline-offset: 2px; }
.alb .an { font-weight: 700; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.alb .aa { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }

.back { display: inline-flex; align-items: center; gap: 2px; height: 36px; margin-top: 6px; padding-inline: 2px 10px; color: var(--muted); font-size: 13px; border-radius: 18px; }
.back svg { width: 20px; height: 20px; }
.hero { display: flex; gap: 14px; align-items: center; padding: 6px 2px 14px; }
.hero .cv { flex: none; width: 104px; height: 104px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); object-fit: cover; display: grid; place-items: center; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.hero .cv svg { width: 40px; height: 40px; }
.hm { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.hn { font-size: 17px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ha { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.hbtns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding-inline: 14px; border-radius: 18px; font-size: 13px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.pill svg { width: 18px; height: 18px; }
.pill.ghost { background: none; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.pill.ghost.warn { color: var(--accent); border-color: var(--accent); }
.discname { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; color: var(--muted); padding: 14px 4px 6px; border-bottom: 1px solid var(--line); }
.tracks { border-top: 1px solid var(--line); }
.discname + .tracks { border-top: 0; }
.tn { flex: none; width: 28px; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.cur .tn { color: var(--accent); font-weight: 500; }
.tracks .pick { padding-block: 12px; }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; color: var(--muted); padding: 24px 16px; border-radius: 18px; }
.empty img { width: 72px; height: 72px; border-radius: 20px; }
.empty b { color: var(--fg); font-family: var(--font-round); font-size: 16px; }
.empty p { margin: 0; max-width: 30ch; text-wrap: balance; }

/* ---- 全画面ビジュアライザー ---- */
#stage { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; color: #fff; background: radial-gradient(circle at 50% 42%, rgb(8 4 12 / .15), rgb(8 4 12 / .6)); }
body.staging .app { visibility: hidden; }
.lookbg { position: absolute; inset: 0; overflow: hidden; }
.lookbg .lk { position: absolute; inset: -18%; background-size: cover; background-position: center; animation: drift 46s ease-in-out infinite alternate; }
.lookbg .lk.grad { inset: 0; background-size: 200% 200%; animation: flow 24s ease-in-out infinite alternate; }
@keyframes flow { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
#custombg { position: fixed; inset: 0; z-index: -1; }
#sveil { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgb(8 4 12 / calc(var(--dim, .35) * .4)), rgb(8 4 12 / var(--dim, .35))); }
@media (prefers-reduced-motion: reduce) { .lookbg .lk { animation: none !important; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; max-height: 72%; overflow-y: auto; color: var(--fg); border-radius: 22px 22px 0 0; padding: 8px 16px max(18px, env(safe-area-inset-bottom)); background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); border-top: 1px solid var(--line); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-family: var(--font-round); font-size: 16px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
.sheet h2 button { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); height: 32px; padding-inline: 10px; }
.opt { padding: 10px 0; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt > .ol { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips button { height: 34px; padding-inline: 12px; border-radius: 17px; font-size: 13px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 700; }
.chips .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .1); }
.chips input[type=color] { width: 40px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: none; }
.opt input[type=range] { width: 100%; }
.opt label.chk { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.opt label.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
body.staging #veil { opacity: 0; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage .scover { position: absolute; left: 50%; top: 42%; width: min(56vw, 260px); aspect-ratio: 1; transform: translate(-50%, -50%) scale(calc(1 + var(--pulse, 0) * .06)); border-radius: 50%; object-fit: cover; box-shadow: 0 0 60px hsl(var(--h) 90% 70% / .55); }
#stage .scover.ph { display: grid; place-items: center; background: hsl(var(--h) 50% 30% / .6); }
#stage .scover.ph svg { width: 40%; height: 40%; color: #fff; opacity: .8; }
.sinfo { position: relative; width: 100%; max-width: 520px; padding: 0 20px max(24px, env(safe-area-inset-bottom)); text-align: center; }
.sinfo .st { font-size: 20px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 2px 12px rgb(0 0 0 / .4); }
.sinfo .sa { font-size: 14px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sctrls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 16px; }
.sctrls .ico { color: #fff; }
.sctrls .play { background: #fff; color: #1a0e1c; box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
.stop { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: space-between; padding-inline: 14px; }
.stop button { height: 38px; padding-inline: 14px; border-radius: 19px; background: rgb(255 255 255 / .16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.stop svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="bg"><div class="bgl blank on" id="bgA"></div><div class="bgl" id="bgB"></div></div>
<div id="veil"></div>

<main class="app">
  <div class="top">
    <div class="brand"><img src="icon-192.png" alt=""><h1>うさチルplayer</h1></div>
    <div class="add">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>曲を追加
      <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple aria-label="曲を追加">
    </div>
  </div>

  <section class="card glass" aria-label="再生中">
    <div class="now">
      <button class="art" id="art" aria-label="エフェクトを全画面で見る">
        <canvas id="ring"></canvas>
        <span class="ph" id="ph"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></span>
        <img id="cover" alt="" hidden>
        <span class="tapme"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></span>
      </button>
      <div class="meta">
        <div class="label">NOW PLAYING</div>
        <div class="title" id="title">曲を選んでください</div>
        <div class="artist" id="artist"></div>
        <div class="sub" id="sub">広告なし / 順番どおり再生</div>
      </div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input id="bar" type="range" min="0" max="1" step="0.1" value="0" aria-label="再生位置">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrls">
      <button class="ico mode" id="shuffle" aria-label="シャッフル" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4.4-1.6-1.1L12.9 6H17zM3 7h4.4l2.3 3.3-1.2 1.7L6.3 9H3zM17 13l4 4-4 4v-3h-4.1l-2.4-3.4 1.2-1.7L13.8 16H17zM3 15h3.3l2 2.8-1.2 1.7L5.2 17H3z"/></svg>
      </button>
      <button class="ico" id="prev" aria-label="前の曲"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ico play" id="play" aria-label="再生"><svg class="playIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ico" id="next" aria-label="次の曲"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      <button class="ico mode" id="repeat" aria-label="リピート" aria-pressed="false">
        <svg id="repIco" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
    </div>
  </section>

  <div class="views">
    <div class="seg glass" role="tablist" aria-label="表示">
      <button role="tab" id="vSongs" aria-selected="true">曲</button>
      <button role="tab" id="vAlbums" aria-selected="false">アルバム</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div class="listhead" id="listhead">
    <input id="q" class="glass" type="search" placeholder="曲名・アーティストで絞り込み" aria-label="絞り込み">
    <button class="chip glass" id="sort">名前順</button>
    <button class="chip glass" id="clear">全削除</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  var ICON_NEXTUP = '<path d="M4 6h10v2H4zM4 11h10v2H4zM4 16h6v2H4zM16 12h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/>';
  var ICON_X = '<path d="M6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/>';
  var ICON_NOTE = '<path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/>';
  var ICON_DISC = '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 13.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm0-5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>';

  }
  function cv(t) {

  }

  /* ---- アルバムのまとめ ---- */
  function albumKey(t) { return t.album ? (t.albumArtist || t.artist || '') + '\u0001' + t.album : '\u0001'; }
  function groupAlbums() {
    var map = {}, out = [];
    tracks.forEach(function (t) {
      var k = albumKey(t);
      if (!map[k]) { map[k] = { key: k, album: t.album || '', artist: '', tracks: [] }; out.push(map[k]); }

    out.forEach(function (a) {
      var ts = a.tracks;

      var hasDisc = ts.some(function (t) { return t.discNo > 0; });

  }
  function drawStage(dt) {
    var dpr = fit(viz), W = viz.width, H = viz.height, cx = W / 2, cy = H * .42;
    vg.clearRect(0, 0, W, H);
    var R = Math.min(W * .28, 130 * dpr) * (1 + pulse * .06);
    // 光の粒
    if (parts.length < look.parts) parts.push({ a: Math.random() * Math.PI * 2, d: R, v: .3 + Math.random() * .7, s: 1 + Math.random() * 2.5, life: 0 });
    vg.globalCompositeOperation = 'lighter';
    parts.forEach(function (p) {
      p.d += (20 + pulse * 260) * p.v * dt * dpr; p.life += dt;
      var x = cx + Math.cos(p.a) * p.d, y = cy + Math.sin(p.a) * p.d, al = Math.max(0, 1 - p.d / (Math.max(W, H) * .7));
      vg.fillStyle = 'rgba(255,255,255,' + (al * .8) + ')';
      vg.beginPath(); vg.arc(x, y, p.s * dpr * (1 + pulse), 0, Math.PI * 2); vg.fill();
      if (al <= 0) { p.d = R; p.a = Math.random() * Math.PI * 2; }
    });
    // 中心の光
    var g = vg.createRadialGradient(cx, cy, R * .8, cx, cy, R * (2.2 + pulse * 1.5));
    g.addColorStop(0, accentRGB(70, .45 + pulse * .4)); g.addColorStop(1, accentRGB(60, 0));
    vg.fillStyle = g; vg.beginPath(); vg.arc(cx, cy, R * 4, 0, Math.PI * 2); vg.fill();
    vg.globalCompositeOperation = 'source-over';

    if (vizMode === 'ring') {
      vg.lineCap = 'round'; vg.lineWidth = Math.max(2, (Math.PI * 2 * R / BINS) * .45);
      for (var i = 0; i < BINS * 2; i++) {
        var lv1 = lv(i < BINS ? i : BINS * 2 - 1 - i), ang = (i / (BINS * 2)) * Math.PI * 2 - Math.PI / 2;
        var r1 = R + 10 * dpr, r2 = r1 + 6 * dpr + lv1 * 90 * dpr;
        vg.strokeStyle = 'rgba(255,255,255,' + (.55 + lv1 * .45) + ')';
        vg.beginPath(); vg.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1); vg.lineTo(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2); vg.stroke();
      }
    } else if (vizMode === 'bars') {
      var bw = W / (BINS * 2), base = H * .74;
      for (var j = 0; j < BINS * 2; j++) {
        var lv2 = lv(j < BINS ? BINS - 1 - j : j - BINS), h = 4 * dpr + lv2 * H * .26;
        var gr = vg.createLinearGradient(0, base - h, 0, base);
        gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, accentRGB(70, .3));
        vg.fillStyle = gr;
        vg.fillRect(j * bw + bw * .18, base - h, bw * .64, h);
        vg.fillStyle = accentRGB(80, .18);
        vg.fillRect(j * bw + bw * .18, base + 3 * dpr, bw * .64, h * .35);
      }
    } else {
      // ほわほわ: 音に合わせてふくらむ柔らかい輪
      for (var k = 0; k < 3; k++) {
        vg.beginPath();
        for (var a2 = 0; a2 <= BINS; a2++) {
          var lv3 = lv(a2 % BINS), ang2 = (a2 / BINS) * Math.PI * 2;
          var rr = R + (18 + k * 22) * dpr + lv3 * (50 + k * 25) * dpr + Math.sin(vt * 1.5 + a2 * .4 + k) * 4 * dpr;
          var x2 = cx + Math.cos(ang2) * rr, y2 = cy + Math.sin(ang2) * rr;
          if (a2) vg.lineTo(x2, y2); else vg.moveTo(x2, y2);
        }
        vg.closePath();
        vg.strokeStyle = 'rgba(255,255,255,' + (.6 - k * .17) + ')'; vg.lineWidth = (3 - k * .7) * dpr; vg.stroke();
      }
    }
  }
  var stageOpen = false, lastT = 0, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t) {
    var dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t;
    sample(dt);
    if (--colTick <= 0) { colTick = 30; colA = accentRGB(matchMedia('(prefers-color-scheme: dark)').matches ? 72 : 50, .9); }
    if (!reduce) document.getElementById('bg').style.setProperty('--pulse', pulse.toFixed(3));
    $('#scover').style.setProperty('--pulse', pulse.toFixed(3));
    drawRing();
    if (stageOpen) drawStage(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      [audio, spare].forEach(function (el) { if (el._vsrc) { try { el._vsrc.disconnect(); } catch (e) {} el._vsrc = null; } });
      live = false;
    } else if (!audio.paused) hookViz();
  });

  $('#art').onclick = function () { startViz(); stageOpen = true; $('#stage').hidden = false; document.body.classList.add('staging'); parts = []; };
  $('#sclose').onclick = function () { stageOpen = false; $('#stage').hidden = true; document.body.classList.remove('staging'); };
  function renderMode() { $('#smode').textContent = 'エフェクト: ' + MODES[vizMode]; }
  $('#smode').onclick = function () {
    var ks = Object.keys(MODES); vizMode = ks[(ks.indexOf(vizMode) + 1) % ks.length];
    lsSet('vizMode', vizMode); renderMode();
  };
  if (!MODES[vizMode]) vizMode = 'ring';
  renderMode();

  $('#slook').onclick = function () { $('#sheet').hidden = !$('#sheet').hidden; };
  $('#lclose').onclick = function () { $('#sheet').hidden = true; };
  $('#lreset').onclick = function () { look = Object.assign({}, LOOK_DEF); saveLook(); applyLook(); };
  $('#lbg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v === 'image') { $('#limage').click(); return; }
    look.bg = b.dataset.v; saveLook(); applyLook();
  });
  $('#lcolor').addEventListener('input', function (e) { look.color = e.target.value; look.bg = 'color'; saveLook(); applyLook(); });
  $('#limage').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    var u = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      var m = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * m); c.height = Math.round(im.height * m);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      look.image = c.toDataURL('image/jpeg', .82); look.bg = 'image'; saveLook(); applyLook();
    };
    im.onerror = function () { URL.revokeObjectURL(u); };
    im.src = u;
  });
  $('#lglow').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; look.glow = b.dataset.v; saveLook(); applyLook(); });
  $('#lglowc').addEventListener('input', function (e) { look.glowColor = e.target.value; look.glow = 'custom'; saveLook(); applyLook(); });
  [['#lparts', 'parts'], ['#lblur', 'blur'], ['#ldim', 'dim'], ['#lgain', 'gain']].forEach(function (p) {
    $(p[0]).addEventListener('input', function (e) { look[p[1]] = +e.target.value; saveLook(); applyLook(); });
  });
  $('#lmain').addEventListener('change', function (e) { look.main = e.target.checked; saveLook(); applyLook(); });
  applyLook();

  /* ---- 起動 ---- */
  shuffle = lsGet('shuffle') === '1';
  var r = lsGet('repeat'); if (r === 'all' || r === 'one') repeat = r;
  if (lsGet('view') === 'albums') view = 'albums';
  renderModes(); renderPlaying(); renderList(); renderNow();
  tx(function (s) { return s.getAll(); }).then(function (all) {
    if (!all || !all.length) return;
    var saved = [];
    try { saved = JSON.parse(lsGet('order') || '[]'); } catch (e) {}
    var pos = {}; saved.forEach(function (id, i) { pos[id] = i; });
    all.sort(function (a, b) {
      var pa = a.id in pos ? pos[a.id] : 1e9, pb = b.id in pos ? pos[b.id] : 1e9;
      return pa !== pb ? pa - pb : a.name.localeCompare(b.name, 'ja', { numeric: true });
    });
    var extra = tracks.filter(function (t) { return !all.some(function (x) { return x.id === t.id; }); });
    tracks = all.concat(extra);
    renderList(); renderNow();
    all.forEach(function (t) { if (t.tagVer !== TAGV) queueEnrich(t); });
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
